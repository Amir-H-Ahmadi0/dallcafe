    <path d="M 445 160 C 465 210, 515 260, 560 315 C 605 370, 622 445, 612 525 C 600 610, 555 680, 480 725 C 405 770, 305 775, 205 710 C 240 730, 310 755, 395 725 C 480 695, 540 625, 560 540 C 572 460, 550 380, 495 305 C 455 250, 442 200, 445 160 Z" fill="url(#dalGold)" />
